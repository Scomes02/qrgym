<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Revisión de animaciones</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  :root { color-scheme: light; }
  body { background: #fff; }
  .g { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; padding: 8px; }
  .c { border: 1px solid #ddd; border-radius: 8px; padding: 4px; font: 11px sans-serif; }
  .c div { display: flex; } .c svg { width: 50%; height: auto; }
</style></head>
<body><div class="g" id="g"></div>
<script src="js/data.js"></script><script src="js/data-extra.js"></script>
  <script src="js/data-free.js"></script><script src="js/config.js"></script><script src="js/graphics.js"></script><script src="js/anim.js"></script><script src="js/anim-extra.js"></script>
  <script src="js/anim-free.js"></script>
<script>
  const qs = new URLSearchParams(location.search), only = qs.get('m'), ids = qs.get('ids') ? qs.get('ids').split(',') : null;
  const from = +(qs.get('from') || 0), cnt = +(qs.get('n') || 999), cols = qs.get('cols');
  if (cols) document.getElementById('g').style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  document.getElementById('g').innerHTML = MACHINES.filter(m => !only || m.id === only).flatMap(m => m.exercises.filter(e => !ids || ids.includes(m.id + '/' + e.id)).map(e =>
    `<div class="c"><b>${m.short} · ${e.name}</b><div>${Anim.staticSVG(m.id, e, 0)}${Anim.staticSVG(m.id, e, 1)}</div></div>`)).slice(from, from + cnt).join('');
</script></body></html>
